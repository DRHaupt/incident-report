<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Field Map</title>
  <meta name="description" content="Field Map for phones: offline-ready map, search, nearest services and directions.">
  <meta name="theme-color" content="#12161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Field Map">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-ui="dark">
  <div id="map" aria-label="Map"></div>

  <header id="top">
    <button id="search-pill" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search address, place, MGRS…</span>
    </button>
  </header>

  <div id="route-banner" role="status" hidden></div>
  <div id="alerts" aria-live="assertive" hidden></div>

  <div id="fabs">
    <button id="btn-compass" class="fab" type="button" aria-label="North up / heading up">
      <svg class="needle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 16 12H8z" fill="#e53935"/><path d="M12 22 8 12h8z" fill="currentColor" opacity=".85"/></svg>
    </button>
    <button id="btn-me" class="fab" type="button" aria-label="Follow my position">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11 21 3l-8 18-2-8z" fill="currentColor"/></svg>
    </button>
  </div>

  <section id="panel" aria-hidden="true" aria-label="Panel">
    <div class="panel-grab" aria-hidden="true"><span></span></div>
    <div class="panel-head">
      <button class="panel-back icon-btn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2 class="panel-title"></h2>
      <button class="panel-close icon-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body"></div>
  </section>

  <div id="bottom">
    <div id="status">
      <span id="status-gps" data-state="wait">GPS…</span>
      <button id="status-coords" type="button" aria-label="Coordinates – tap to change format"></button>
      <span id="status-speed"></span>
      <span id="status-data"></span>
    </div>
    <nav id="tabs" aria-label="Main">
      <button type="button" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></button>
      <button type="button" data-tab="nearest"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Nearest</span></button>
      <button type="button" data-tab="layers"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>Layers</span></button>
      <button type="button" data-tab="items"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>Items</span></button>
      <button type="button" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>More</span></button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="splash">
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <p id="splash-text">Loading Field Map…</p>
    <button id="splash-retry" type="button" class="btn primary" hidden>Try again</button>
  </div>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
